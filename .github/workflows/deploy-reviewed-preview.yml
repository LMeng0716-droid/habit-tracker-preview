name: Deploy reviewed preview artifact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-reviewed-preview.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  deploy-reviewed-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved public-source build artifact
        uses: actions/download-artifact@v4
        with:
          name: habit-tracker-preview-82cf8525f32a114a26a82a462b11bd6ad6245221
          path: incoming-preview
          github-token: ${{ github.token }}
          repository: LMeng0716-droid/habit-tracker
          run-id: 39038441315
      - name: Validate and install static preview
        shell: bash
        run: |
          set -euo pipefail
          test -s incoming-preview/index.html
          test -s incoming-preview/manifest.webmanifest
          find incoming-preview -maxdepth 3 -type f -print
          test -s incoming-preview/assets/index-pJcFsdqp.js && { echo "Unexpected stale bundle"; exit 1; } || true
          grep -q '/habit-tracker-preview/assets/' incoming-preview/index.html
          test -f incoming-preview/icons/icon-192.png
          test -f incoming-preview/icons/icon-512.png
          test -f incoming-preview/icons/apple-touch-icon.png
          mkdir -p assets icons
          cp incoming-preview/index.html incoming-preview/manifest.webmanifest ./
          cp -R incoming-preview/assets/. assets/
          cp -R incoming-preview/icons/. icons/
      - name: Commit preview site only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest assets icons
          if ! git diff --cached --quiet; then
            git commit -m "deploy: reviewed preview build 82cf852"
            git push origin HEAD:main
          fi
